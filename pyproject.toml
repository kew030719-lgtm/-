[project]
name = "career-radar"
version = "0.1.0"
description = "Resume-driven job discovery and evidence-backed career analysis"
requires-python = ">=3.11,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "playwright>=1.62,<1.63",
  "pydantic>=2.12,<3",
  # The `mcp` extra is what makes it possible to attach an external MCP server
  # as a client. CareerRadar no longer *serves* MCP itself.
  "pydantic-ai-slim[openai,mcp]>=1.107,<2",
  "langgraph>=1.2,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
  "keyring>=25,<26; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
career-radar = "career_radar.web:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["career_radar"]
