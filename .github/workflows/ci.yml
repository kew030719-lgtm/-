name: test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.cjs
      - run: pytest -q
        env:
          TOKEN_PLAN_API_KEY: ""
          CAREER_RADAR_LIVE_TEST: "0"
